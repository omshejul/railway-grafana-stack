global:
  scrape_interval: 15s # Default scrape interval

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # - job_name: 'example_api'
  #   scheme: http
  #   static_configs:
  #     - targets: ['example_api:9091']

  #  ? TODO: add your services here
  # - job_name: 'your-job-name'
  #   scheme: https
  #   static_configs:
  #     - targets: ['URL_GOES_HERE']
  #   basic_auth:
  #     username: HTTP_AUTH_USERNAME_GOES_HERE
  #     password: HTTP_AUTH_PASSWORD_GOES_HERE

  - job_name: 'amul-stock-checker-api'
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets: ['eu.srv.theom.app:8094']
        labels:
          project: 'amul-stock-checker'
          environment: 'production'
          service: 'api'

  - job_name: 'amul-stock-checker-web'
    scheme: https
    metrics_path: /api/metrics
    static_configs:
      - targets: ['amul.omshejul.com:443']
        labels:
          project: 'amul-stock-checker'
          environment: 'production'
          service: 'web'

  - job_name: 'amul-stock-checker-log-gateway'
    static_configs:
      - targets: ['amul-stock-checker-log-gateway.railway.internal:12345']
        labels:
          project: 'amul-stock-checker'
          environment: 'production'
          service: 'log-gateway'

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          project: 'grafana'
          environment: 'production'
          service: 'prometheus'

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana.railway.internal:3000']
        labels:
          project: 'grafana'
          environment: 'production'
          service: 'grafana'

  - job_name: 'loki'
    static_configs:
      - targets: ['loki.railway.internal:3100']
        labels:
          project: 'grafana'
          environment: 'production'
          service: 'loki'

  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo.railway.internal:3200']
        labels:
          project: 'grafana'
          environment: 'production'
          service: 'tempo'

  - job_name: 'pettech-api'
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ['api-furryfur.up.railway.app:443']
        labels:
          project: 'pettech'
          environment: 'production'
          service: 'api'

  - job_name: 'pettech-web'
    scheme: https
    metrics_path: /api/metrics
    static_configs:
      - targets: ['furryfur.dog:443']
        labels:
          project: 'pettech'
          environment: 'production'
          service: 'web'

  - job_name: 'cronbolt-api'
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: []
        labels:
          project: 'cronbolt'
          environment: 'production'
          service: 'api'

  - job_name: 'cronbolt-web'
    scheme: https
    metrics_path: /api/metrics
    static_configs:
      - targets: []
        labels:
          project: 'cronbolt'
          environment: 'production'
          service: 'web'

  - job_name: 'amul-stock-checker-api'
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets: ['eu.srv.theom.app:8094']
        labels:
          project: 'amul-stock-checker'
          environment: 'production'
          service: 'api'

  - job_name: 'amul-stock-checker-web'
    scheme: https
    metrics_path: /api/metrics
    static_configs:
      - targets: ['amul.omshejul.com:443']
        labels:
          project: 'amul-stock-checker'
          environment: 'production'
          service: 'web'

  - job_name: 'amul-stock-checker-log-gateway'
    static_configs:
      - targets: ['amul-stock-checker-log-gateway.railway.internal:12345']
        labels:
          project: 'amul-stock-checker'
          environment: 'production'
          service: 'log-gateway'

  - job_name: 'bookkeeping-caddy'
    scheme: https
    metrics_path: /caddy
    basic_auth:
      username: prometheus
      password_file: /etc/prometheus/secrets/bookkeeping-metrics-password
    static_configs:
      - targets: ['metrics.bookkeeping.theom.app:443']
        labels:
          project: 'bookkeeping'
          environment: 'production'
          service: 'caddy'

  - job_name: 'bookkeeping-worker'
    scheme: https
    metrics_path: /worker
    basic_auth:
      username: prometheus
      password_file: /etc/prometheus/secrets/bookkeeping-metrics-password
    static_configs:
      - targets: ['metrics.bookkeeping.theom.app:443']
        labels:
          project: 'bookkeeping'
          environment: 'production'
          service: 'worker'

  - job_name: 'tds-worker'
    scheme: https
    metrics_path: /tds-worker
    basic_auth:
      username: prometheus
      password_file: /etc/prometheus/secrets/bookkeeping-metrics-password
    static_configs:
      - targets: ['metrics.bookkeeping.theom.app:443']
        labels:
          project: 'tds'
          environment: 'production'
          service: 'worker'
